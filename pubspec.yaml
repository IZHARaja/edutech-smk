name: edutech_smk
description: "LMS EduTech SMK - Mobile Cross-Platform Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase Core & Services
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.2
  firebase_messaging: ^15.1.3

  # State Management
  provider: ^6.1.2

  # UI & Styling
  google_fonts: ^6.2.1
  flutter_spinkit: ^5.2.1

  # Jalankan `flutter pub add file_picker` atau `flutter pub get` setelah Flutter CLI tersedia.
  file_picker: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
